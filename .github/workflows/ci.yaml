name: CI/CD - democyber

# Déclenche le workflow lors d'un push ou d'une pull request sur la branche main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/democyber:latest

    steps:
      # 1. Récupérer le code source du dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

           # Gitleaks scan (avant la compilation)
      - name: Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # 2. Installer Java (JDK 21 - Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Compiler le code Java
      - name: Compile Java
        run: mvn compile

      # 4. Générer le fichier JAR avec Maven
      - name: Build Java project with Maven
        run: mvn clean package

      # 5. Se connecter à Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Construire et pousser l'image Docker sur Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}